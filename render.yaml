services:
  - type: web
    name: irvite-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --legacy-peer-deps && npx prisma generate --schema=packages/database/prisma/schema.prisma && npm run build --workspace=apps/api-server
    startCommand: npm run start:prod --workspace=apps/api-server
    healthCheckPath: /api/v1/templates/public/availability
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRATION
        value: 12h
      - key: PUBLIC_INVITATION_URL
        value: https://irvite-id.vercel.app
